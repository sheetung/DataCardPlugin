apiVersion: v1
kind: Plugin
metadata:
  author: sheetung
  name: DataCardPlugin
  repository: 'https://github.com/sheetung/DataCardPlugin'
  version: 0.3.2
  description:
    en_US: 流量卡查询
    zh_Hans: 流量卡查询
  label:
    en_US: DataCardPlugin
    zh_Hans: DataCardPlugin
  icon: assets/icon.png
spec:
  config:
    - name: llkshop_id
      type: string
      label:
        en_US: 'LLKShop ID'
        zh_Hans: 'LLKShop ID'
      required: true
      default: '3abcd2e80b9b4694'
    - name: use_forward
      type: boolean
      label:
        en_US: 'Enable Forwarding Merge'
        zh_Hans: '是否启用合并转发（仅适配OneBot）'
      required: false
      default: true
    - name: onebot_api_url
      type: string
      label:
        en_US: 'OneBot API URL'
        zh_Hans: 'OneBot API 地址'
      required: false
      default: 'http://127.0.0.1:3000'
  components:
    EventListener:
      fromDirs:
      - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: DataCardPlugin
